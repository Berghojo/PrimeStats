services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: primestats
      POSTGRES_PASSWORD: primestats
      POSTGRES_DB: primestats
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primestats"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://primestats:primestats@db:5432/primestats
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
