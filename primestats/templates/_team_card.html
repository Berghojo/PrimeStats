<a class="card" href="{{ url_for('main.team_detail', team_id=team.id) }}" style="display:block;color:inherit;text-decoration:none">
  <div class="team-head">
    <div class="team-logo">{{ (team.tag or team.name)[:4] }}</div>
    <div>
      <h3>{{ team.name }}</h3>
      <div class="muted small">{{ team.members|length }} Spieler ·
        {% if team.last_synced %}zuletzt synchronisiert{% else %}noch nicht synchronisiert{% endif %}</div>
    </div>
  </div>
  <div class="names muted small" style="margin-top:.6rem">{% for m in team.members %}{{ m.game_name }}{{ ' · ' if not loop.last }}{% endfor %}</div>
</a>
