<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeSearch</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.4"></script>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bbbootstrap/libraries@main/choices.min.css">
<script src="https://cdn.jsdelivr.net/gh/bbbootstrap/libraries@main/choices.min.js"></script>
<style>
  .mt-100 {
    margin-top: 10px
  }

  tr.toplvl:nth-child(even) {
    background: #CCC
  }

  tr.toplvl:nth-child(odd) {
    background: #FFF
  }

  .loader {
    border: 16px solid #f3f3f3;
    /* Light grey */
    border-top: 16px solid #1c1c1c;
    /* Blue */
    border-radius: 50%;
    margin-left: auto;
    margin-right: auto;
    width: 120px;
    height: 120px;
    animation: spin 2s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }

  .htmx-indicator {
    display: none
  }

  .htmx-indicator.htmx-request {
    display: block;
  }

  .htmx-indicator.htmx-request~span {
    display: none;
  }
</style>

<script>
  const selectedIds = new Set();

  function toggleSelection(row) {

    const gameId = row.dataset.gameId;
    console.log(gameId)
    if (selectedIds.has(gameId)) {
      selectedIds.delete(gameId);
      row.style.backgroundColor = "";
    } else {
      selectedIds.add(gameId);
      row.style.backgroundColor = "#d3f9d8"; // highlight color
    }

    document.getElementById("selectedGameIds").value = JSON.stringify([...selectedIds]);
    console.log(selectedIds)
  }
  

  function selectAll(){
    const games = document.getElementsByClassName("game-select");

    for (let i = 0; i < games.length; i++) {
      selectedIds.add(games.item(i).dataset.gameId);
      games.item(i).style.backgroundColor = "#d3f9d8";

    }
    document.getElementById("selectedGameIds").value = JSON.stringify([...selectedIds]);
    console.log(selectedIds)
  }
  function clearAll(){
    const games = document.getElementsByClassName("game-select");

    for (let i = 0; i < games.length; i++) {
      if(selectedIds.has(games.item(i).dataset.gameId)) {
      selectedIds.delete(games.item(i).dataset.gameId);
      games.item(i).style.backgroundColor = "";
      }
    }
    document.getElementById("selectedGameIds").value = JSON.stringify([...selectedIds]);
    console.log(selectedIds)
  }
</script>

<body>

  <section class="section">
    <div class="columns">
      <div class="column is-one-third is-offset-one-third">
        <input type="text" class="input" placeholder="Search" name="q">
      </div>
    </div>
    <table class="hero-buttons buttons">
      <tbody>
        <tr>
          <td>
            <button class="button" hx-get="/search" hx-trigger="click" hx-target="#results" hx-include="[name='q']"
              hx-indicator="#loader">Search</button>
          </td>
          <td>
            <button class="button" onclick="selectAll()">Select
              all</button>
          </td>
          <td>
            <button class="button" onclick="clearAll()">Deselect all</button>
          </td>
          <td>

            <input type="hidden" name="gameIds" id="selectedGameIds" />
            <button class="button" id="submitSelectedGames" hx-get="/data" hx-trigger="click from:#submitSelectedGames"
              hx-include="#selectedGameIds" hx-target="#results">Go to Data</button>


          </td>
        </tr>

      </tbody>
    </table>
    <div id="results">

    </div>

  </section>
  <div class="loader htmx-indicator" id="loader"></div>
</body>

</html>
